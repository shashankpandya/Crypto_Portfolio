name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            vite-project/package-lock.json
            smart_contract/package-lock.json

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Install frontend deps
        run: npm ci
        working-directory: vite-project

      - name: Install contract deps
        run: npm ci --legacy-peer-deps
        working-directory: smart_contract

      - name: Test server
        run: npm test
        working-directory: server

      - name: Test frontend
        run: npm test
        working-directory: vite-project

      - name: Compile contracts
        run: npx hardhat compile
        working-directory: smart_contract

      - name: Test contracts
        run: npm test
        working-directory: smart_contract

      - name: Build frontend
        run: npm run build
        working-directory: vite-project

      - name: Check bundle size budget
        run: node scripts/check-bundle-size.cjs
        working-directory: vite-project

      - name: Check Lighthouse budget
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 > /dev/null && break; sleep 1; done
          node scripts/check-lighthouse.cjs
        working-directory: vite-project
